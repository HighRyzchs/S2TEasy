name: Feature request
description: Propose a concrete improvement to S2Teasy.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to complete and who it helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives, accessibility concerns, and privacy expectations where relevant.
    validations:
      required: true
