name: Bug report
description: Report a reproducible problem using synthetic, non-sensitive data.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private recordings, or real dictation history. Report security issues privately; see SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, Windows version, and speech engine/model
    validations:
      required: true
