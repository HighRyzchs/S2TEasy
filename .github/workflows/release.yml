name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/check-update-helper.mjs
      - run: npm run build:win
      - name: Exercise real installed-app upgrade
        run: node scripts/windows-update-smoke.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Release-update-diagnostics
          path: |
            release/update-smoke/
            release/windows-update-smoke.json
      - name: Write artifact checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/latest.yml
            release/*.blockmap
