name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - name: Exercise actual Electron updater handoff
        run: node scripts/test-electron-update-handoff.mjs
      - name: Exercise real installed-app upgrade
        run: node scripts/windows-update-smoke.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-update-diagnostics
          path: |
            release/update-smoke/
            release/electron-handoff/
            release/windows-update-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: S2Teasy-windows
          path: |
            release/*.exe
            release/S2Teasy*.exe
            release/windows-update-smoke.json
