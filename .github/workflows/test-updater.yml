name: Native updater regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/shared/update-install.ts'
      - 'scripts/windows-update-smoke.mjs'
      - '.github/workflows/test-updater.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-update-helper.mjs
      - name: Exercise new helper against published installers
        run: node scripts/windows-update-smoke.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          S2T_SMOKE_TARGET_VERSION: '1.7.0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-update-regression-diagnostics
          path: |
            release/update-smoke/
            release/windows-update-smoke.json
